apiVersion: v1
kind: Service
metadata:
  name: cloud-vault-service
  namespace: cloud-vault
  labels:
    app.kubernetes.io/name: cloud-vault
spec:
  type: NodePort
  selector:
    app: cloud-vault
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
